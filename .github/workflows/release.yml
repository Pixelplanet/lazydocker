name: Release

# Builds static Linux binaries and publishes them to a GitHub Release.
#
# Trigger it either by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# or manually from the Actions tab ("Run workflow"), where you supply the
# version/tag to create.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  # Required so the workflow's GITHUB_TOKEN can create the release.
  contents: write

env:
  GOFLAGS: -mod=vendor
  GO_VERSION: "1.24"

jobs:
  release:
    name: Build and release Linux binaries
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          fi

          # Strip a leading 'v' for the artifact names only; the release tag
          # keeps whatever was pushed.
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so --generate-notes can build the changelog and so we
          # can tell whether the tag already exists as a ref.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Linux binaries
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DIST="dist"
          mkdir -p "$DIST"

          # goarch:goarm pairs. Empty GOARM is unset for non-ARM targets.
          for target in "amd64" "arm64" "arm:7"; do
            ARCH="${target%%:*}"
            GOARM=""
            if [ "$ARCH" != "$target" ]; then
              GOARM="${target##*:}"
            fi

            NAME="lazydocker_${{ steps.version.outputs.number }}_linux_${ARCH}"
            if [ -n "$GOARM" ]; then
              NAME="${NAME}v${GOARM}"
            fi

            echo "::group::Building ${NAME}"

            # CGO off keeps the binary fully static, so it runs on any Linux
            # distribution (glibc or musl) without runtime dependencies.
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" GOARM="$GOARM" \
              go build -trimpath \
              -ldflags "-s -w \
                -X main.version=${TAG} \
                -X main.commit=${COMMIT} \
                -X main.date=${DATE} \
                -X main.buildSource=release" \
              -o "${DIST}/lazydocker" .

            # Smoke test the natively runnable build before packaging it.
            if [ "$ARCH" = "amd64" ]; then
              "./${DIST}/lazydocker" --version
            fi

            tar -czf "${DIST}/${NAME}.tar.gz" -C "$DIST" lazydocker
            rm "${DIST}/lazydocker"

            echo "::endgroup::"
          done

          cd "$DIST"
          sha256sum ./*.tar.gz > checksums.txt

          echo "=== release assets ==="
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-${{ steps.version.outputs.number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          ARGS=(--title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets."
            gh release upload "$TAG" dist/* --clobber
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            # The tag exists (the usual case for a tag push) but has no release.
            gh release create "$TAG" dist/* "${ARGS[@]}"
          else
            # Manual run without a tag: create the tag at the commit we built.
            gh release create "$TAG" dist/* "${ARGS[@]}" --target "$GITHUB_SHA"
          fi
